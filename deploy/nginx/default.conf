# Planwright static server (nginx-unprivileged, listens on 8080 as a non-root user).
# Everything runs in the browser: this server only hands out files, so it has no upstreams and no state.

server_tokens off;

# Precompressed .gz files are produced at image build time; dynamic gzip covers anything else.
gzip_static on;
gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;
gzip_vary on;

map $uri $planwright_cache {
    ~^/assets/                 "public, max-age=31536000, immutable";
    ~^/(sw\.js|index\.html)$   "no-cache";
    default                    "public, max-age=3600";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Small static app: no request bodies, short timeouts.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control $planwright_cache always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Hashed build output: a missing file is a real 404, never the app shell.
    location /assets/ {
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    # mime.types has no entry for web app manifests.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Every other path is a route of the single-page app.
    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        try_files $uri /index.html;
    }
}
