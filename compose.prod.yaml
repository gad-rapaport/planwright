# Overrides for a future public demo behind a TLS-terminating reverse proxy on the same host.
# Not used locally. Usage on a server:
#   IMAGE=ghcr.io/<owner>/planwright@sha256:... docker compose -f compose.yaml -f compose.prod.yaml up -d
# See docs/DEPLOYMENT.md. The proxy (not part of this repo) is the only public listener and adds HSTS.
services:
  web:
    image: ${IMAGE:?IMAGE must be a pinned registry reference}
    build: !reset null
    ports: !override
      - '127.0.0.1:8104:8080'
